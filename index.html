<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketoazidose-Vermeidungsplan</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #121212; color: white; padding: 15px; line-height: 1.5; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        h2 { color: #e74c3c; text-align: center; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #aaa; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; box-sizing: border-box; font-size: 16px; }
        
        .instruction-card { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; }
        .warning { background: #442a1a; border-left: 5px solid #e67e22; }
        .danger { background: #441a1a; border-left: 5px solid #e74c3c; }
        .safe { background: #1a4423; border-left: 5px solid #2ecc71; }
        
        .emergency-box { background: #ff0000; color: white; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; margin-top: 20px; border: 2px solid white; }
        
        ul { padding-left: 20px; margin: 10px 0; }
        li { margin-bottom: 8px; }
        .step-btn { background: #3498db; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .highlight { font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚠️ Ketoazidose-Plan</h2>

    <div class="input-group">
        <label>Blutzucker-Einheit:</label>
        <select id="bz-unit" onchange="resetView()">
            <option value="mgdl">mg/dl</option>
            <option value="mmol">mmol/l</option>
        </select>
    </div>

    <div class="input-group">
        <label id="bz-label">Aktueller Blutzucker:</label>
        <input type="number" id="bz-value" placeholder="z.B. 260">
    </div>

    <button class="step-btn" onclick="checkBZ()">Status prüfen</button>

    <div id="keton-section" style="display:none; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px;">
        <label>Keton-Messung:</label>
        <select id="keton-type" onchange="toggleKetonInput()">
            <option value="">-- Messart wählen --</option>
            <option value="blood">Blut-Keton (mmol/l)</option>
            <option value="urine">Urin-Keton (Azetontest)</option>
        </select>

        <div id="blood-input" style="display:none; margin-top:10px;">
            <label>Messwert im Blut:</label>
            <input type="number" id="blood-keton" step="0.1" placeholder="z.B. 1.6">
        </div>

        <div id="urine-input" style="display:none; margin-top:10px;">
            <label>Ergebnis Urinstix:</label>
            <select id="urine-keton">
                <option value="0">Negativ (-)</option>
                <option value="1">Azeton + (leicht)</option>
                <option value="2">Azeton ++ / +++ (hoch)</option>
            </select>
        </div>
        <button class="step-btn" style="background: #e67e22;" onclick="checkKetones()">Handlungsplan anzeigen</button>
    </div>

    <div id="result" class="instruction-card"></div>

    <div class="emergency-box">
        🚨 ACHTUNG:<br>
        Bei Übelkeit, Erbrechen, Atemnot oder obstartigem Mundgeruch -> SOFORT NOTARZT (112) RUFEN!
    </div>
</div>

<script>
function resetView() {
    document.getElementById('bz-label').innerText = `Aktueller Blutzucker (${document.getElementById('bz-unit').value}):`;
    document.getElementById('keton-section').style.display = 'none';
    document.getElementById('result').style.display = 'none';
}

function checkBZ() {
    const bz = parseFloat(document.getElementById('bz-value').value);
    const unit = document.getElementById('bz-unit').value;
    const limit = (unit === 'mgdl') ? 250 : 14;
    const res = document.getElementById('result');

    if (bz >= limit) {
        document.getElementById('keton-section').style.display = 'block';
        res.innerHTML = "<strong>BZ über Grenzwert!</strong><br>1. Korrektur-Insulin laut Plan geben.<br>2. Nach 1 Stunde erneut kontrollieren.<br>3. <span class='highlight'>Jetzt Ketone messen!</span>";
        res.className = "instruction-card warning";
        res.style.display = "block";
    } else {
        res.innerHTML = "Blutzucker unter Warnschwelle. Bei Unwohlsein trotzdem stündlich kontrollieren.";
        res.className = "instruction-card safe";
        res.style.display = "block";
    }
}

function toggleKetonInput() {
    const type = document.getElementById('keton-type').value;
    document.getElementById('blood-input').style.display = (type === 'blood') ? 'block' : 'none';
    document.getElementById('urine-input').style.display = (type === 'urine') ? 'block' : 'none';
}

function checkKetones() {
    const type = document.getElementById('keton-type').value;
    const res = document.getElementById('result');
    let level = 0; 

    if (type === 'blood') {
        const val = parseFloat(document.getElementById('blood-keton').value);
        if (val < 0.6) level = 0;
        else if (val >= 0.6 && val <= 1.5) level = 1;
        else if (val > 1.5) level = 2;
    } else {
        level = parseInt(document.getElementById('urine-keton').value);
    }

    let header = "";
    let rules = "";
    
    if (level === 0) {
        res.className = "instruction-card safe";
        header = "✅ Problem vorerst gelöst!";
        rules = "<li>Stündliche Messung bis BZ < 200 mg/dl (11 mmol/l).</li><li>Bei Absinken unter 180 mg/dl: 1-2 KE essen (z.B. Banane) OHNE zu bolen!</li>";
    } else {
        const isDanger = (level === 2);
        res.className = isDanger ? "instruction-card danger" : "instruction-card warning";
        header = isDanger ? "🔴 ALARM: Starke Ketoazidose-Gefahr!" : "🟠 WARNUNG: Azeton positiv!";
        
        const insulinAction = isDanger ? "<span class='highlight'>DOPPELTES Korrekturinsulin</span> per Pen/Spritze!" : "Korrekturinsulin laut Plan per Pen/Spritze!";
        
        rules = `
            <li>${insulinAction}</li>
            <li><strong>Viel trinken:</strong> ca. 0,5 - 1 Liter pro Stunde (Wasser, Tee).</li>
            <li><span class='highlight'>KEINE körperliche Aktivität!</span> (Absolute Ruhe)</li>
            <li><strong>Nicht einschlafen!</strong></li>
            <li>Bei Pumpentherapie: <strong>Katheter wechseln!</strong></li>
            <li>BZ- und Azetonkontrolle nach 1 Std. wiederholen.</li>
            ${isDanger ? "<li><strong>Sofortige Rücksprache mit der Diabetesstation!</strong></li>" : ""}
        `;
    }
    
    res.innerHTML = `<strong>${header}</strong><ul>${rules}</ul>`;
    res.style.display = "block";
}
</script>
</body>
</html>
